<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #2c3e50; color: white; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; color: white;
            text-decoration: none; cursor: pointer; font-size: 14px; }
        .alta { background: #27ae60; }
        .mod { background: #f39c12; }
        .del { background: #c0392b; }
    </style>
</head>
<body>
<h1>Gestión de Clientes</h1>
<a class="btn alta" th:href="@{/clientes/nuevo}">+ Alta de cliente</a>

<table>
    <thead>
    <tr>
        <th>ID</th><th>Nombre</th><th>Apellidos</th><th>Categoría</th>
        <th>Límite crédito</th><th>Fecha creación</th><th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${clientes}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.nombre}"></td>
        <td th:text="${c.apellidos}"></td>
        <td th:text="${c.category}"></td>
        <td th:text="${c.limite_credito}"></td>
        <td th:text="${c.creationDate != null} ? ${#temporals.format(c.creationDate,'dd/MM/yyyy HH:mm')} : ''"></td>
        <td>
            <a class="btn mod" th:href="@{/clientes/editar/{id}(id=${c.id})}">Modificar</a>
            <form th:action="@{/clientes/eliminar/{id}(id=${c.id})}" method="post"
                  style="display:inline" onsubmit="return confirm('¿Eliminar cliente?')">
                <button class="btn del" type="submit">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
