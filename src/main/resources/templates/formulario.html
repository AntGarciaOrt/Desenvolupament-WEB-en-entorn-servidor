<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cliente</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select { padding: 6px; width: 300px; }
        .error { color: #c0392b; font-size: 13px; }
        button, a.cancel { margin-top: 18px; padding: 8px 14px; }
    </style>
</head>
<body>
<h1 th:text="${titulo}">Cliente</h1>

<form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
    <input type="hidden" th:field="*{id}">

    <label>Nombre</label>
    <input type="text" th:field="*{nombre}">
    <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>

    <label>Apellidos</label>
    <input type="text" th:field="*{apellidos}">
    <span class="error" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></span>

    <label>Categoría</label>
    <select th:field="*{category}">
        <option value="Bronce">Bronce</option>
        <option value="Plata">Plata</option>
        <option value="Oro">Oro</option>
        <option value="VIP">VIP</option>
    </select>

    <label>Límite de crédito</label>
    <input type="number" step="0.01" th:field="*{limite_credito}">

    <br>
    <button type="submit">Guardar</button>
    <a class="cancel" th:href="@{/clientes}">Cancelar</a>
</form>
</body>
</html>
